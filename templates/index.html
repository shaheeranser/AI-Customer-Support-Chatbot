
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Support Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="d-flex flex-column vh-100">
    <header class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Customer Support Chatbot</span>
            <small class="text-light-50">Web App (Flask)</small>
        </div>
    </header>

    <main class="container py-3 d-flex flex-column flex-grow-1">
        <div id="chat-box" class="chat-box border rounded flex-grow-1 p-3 mb-3 overflow-auto">
            <!-- Messages will be appended here -->
        </div>

        <form id="chat-form" class="input-group">
            <input id="message-input" class="form-control" type="text" placeholder="Type your message..." autocomplete="off" />
            <button id="send-btn" class="btn btn-primary" type="submit">Send</button>
        </form>
        <div id="helper" class="form-text mt-2">
            Press <kbd>Enter</kbd> to send • Shift+Enter for new line
        </div>
    </main>

    <script src="/static/js/chat.js"></script>
</body>
</html>
